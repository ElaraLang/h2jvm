name: "Setup Nix"
description: "Installs Nix with the Elara attic cache and the Tek Cachix cache"
inputs:
  github-token:
    description: "GitHub Token for Nix access-tokens"
    required: true
    default: ${{ github.token }}
  attic-token:
    description: "Attic token for the Elara cache"
    required: true
runs:
  using: "composite"
  steps:
    - uses: wimpysworld/nothing-but-nix@main
    - uses: DeterminateSystems/nix-installer-action@main
      with:
        extra-conf: |
          extra-substituters = https://cache.bristermitten.me/elara https://tek.cachix.org
          extra-trusted-public-keys = elara:6GWLPsvcEXZFVCx4J8I8sB4jjppOB2/ISjt5oGXXkLo= tek.cachix.org-1:+sdc73WFq8aEKnrVv5j/kuhmnW2hQJuqdPJF5SnaCBk=
    - uses: ryanccn/attic-action@v0
      with:
        endpoint: https://cache.bristermitten.me/
        cache: elara
        token: ${{ inputs.attic-token }}
